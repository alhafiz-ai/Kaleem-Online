<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Al-Danish Online Islamic & Arabic Academy</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        // Check if user was visiting admin
        if (path.includes('admin')) {
          hash = '#admin';
        }

        // Determine destination base for GitHub Pages or root domains
        var segments = path.split('/').filter(Boolean);
        var repoName = segments.length > 0 && window.location.hostname.endsWith('github.io') ? '/' + segments[0] + '/' : '/';
        
        window.location.replace(repoName + search + hash);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; background-color: #0c0a09; color: #f5f5f4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #fbbf24;">Al-Danish Islamic & Arabic Academy</h2>
      <p style="color: #a8a29e;">Loading academy portal...</p>
    </div>
  </body>
</html>
